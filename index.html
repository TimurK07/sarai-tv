<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Сарай TV — новости Великой степи в эпоху Золотой Орды.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%23D6A64A%27/%3E%3Ccircle cx=%2748%27 cy=%2716%27 r=%277%27 fill=%27%23D8413A%27/%3E%3C/svg%3E">
<title>Сарай TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0F1012; --studio:#15161A; --panel:#1B1C20; --panel2:#212227; --line:#2C2E34;
  --text:#EFEBE3; --muted:#A4A5AA; --faint:#74767D; --gold:#D6A64A; --gold2:#EBC77D; --red:#D8413A;
  --head:"Oswald","Arial Narrow",Arial,sans-serif; --body:"Onest","Segoe UI",Roboto,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.app{max-width:1600px;margin:0 auto;min-height:100%;display:grid;grid-template-rows:auto 1fr auto auto auto;gap:12px;padding-block:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:0;font-family:var(--head);font-weight:700;letter-spacing:.04em;font-size:26px;line-height:1}
.logo b{background:var(--gold);color:#17130A;padding:6px 10px 6px 12px;border-radius:6px 0 0 6px}
.logo span{background:#26272C;padding:6px 12px 6px 10px;border-radius:0 6px 6px 0;color:var(--text)}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.12em;color:#fff;background:var(--red);padding:5px 12px;border-radius:4px}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.rubric-now{font-family:var(--head);font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rubric-now b{color:var(--gold2);font-weight:500}
.clock{margin-left:auto;display:flex;align-items:baseline;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
.clock small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint)}
.clock strong{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;min-height:0}
.monitor{position:relative;background:#0C0D0F;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:320px}
.monitor svg{display:block;width:100%;height:100%;object-fit:contain}
.onair{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.onair small{font-family:var(--head);font-size:13px;letter-spacing:.16em;color:var(--red);font-weight:600}
.onair strong{font-family:var(--head);font-size:clamp(20px,2.1vw,30px);font-weight:600;line-height:1.05;text-shadow:0 2px 12px #000}
.legend{position:absolute;right:12px;bottom:10px;display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;font-size:12px;color:var(--muted);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0}
.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.flash div{font-family:var(--head);font-weight:700;font-size:clamp(34px,5vw,72px);letter-spacing:.1em;color:#fff;background:var(--red);padding:6px 28px;transform:skewX(-8deg)}
.flash.go{animation:flash 1.3s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}

.desk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
.desk-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-family:var(--head);font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:4px;background:#2A2B30;color:var(--gold2)}
.tag.breaking{background:var(--red);color:#fff}
.count{font-family:var(--mono);font-size:12px;color:var(--faint)}
.desk h2{margin:0;font-family:var(--head);font-weight:600;font-size:clamp(28px,2.9vw,50px);line-height:1.08;text-wrap:balance}
.lead{margin:0;font-size:clamp(16px,1.3vw,22px);line-height:1.55;color:#DCD8D0}
.src{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.src b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:500;margin-right:6px}
.swap{transition:opacity .35s ease, transform .35s ease}
.swap.out{opacity:0;transform:translateY(8px)}

/* extras */
.quote{margin:0;padding:14px 18px;border-left:3px solid var(--gold);background:var(--panel2);border-radius:0 10px 10px 0;font-size:clamp(16px,1.3vw,21px);font-style:italic;line-height:1.5}
.quote cite{display:block;margin-top:8px;font-style:normal;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel2);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--head);font-size:clamp(26px,2.2vw,38px);font-weight:600;color:var(--gold2);line-height:1.05}
.stat span{font-size:clamp(14px,1vw,16px);color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{background:var(--panel2);border-radius:10px;padding:12px 14px}
.col b{display:block;font-family:var(--head);font-size:18px;font-weight:600;margin-bottom:4px}
.col em{display:block;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--gold2);margin-bottom:6px}
.col span{font-size:clamp(14px,.95vw,16px);color:#D2CEC6;line-height:1.45}
.words{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.word{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:16px}
.word b{font-family:var(--head);font-weight:500;color:var(--gold2);font-size:18px}
.word i{color:var(--faint);font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:clamp(14px,1vw,17px);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:clamp(15px,1.1vw,18px)}
.list li b{font-family:var(--head);font-weight:500;font-size:17px;color:var(--gold2);margin-right:6px}

/* poll */
.poll{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--panel2);border-radius:10px;padding:12px 14px}
.opt .name{font-family:var(--head);font-size:20px;font-weight:500}
.opt .ctl{display:flex;align-items:center;gap:6px}
.opt .ctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#2A2B30;cursor:pointer;font-size:18px}
.opt .ctl button:hover{border-color:var(--gold)}
.opt .n{font-family:var(--mono);font-size:22px;font-weight:700;min-width:2.5ch;text-align:right;color:var(--gold2)}
.opt .meter{grid-column:1/-1;height:8px;background:#2A2B30;border-radius:4px;overflow:hidden}
.opt .meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.hint{font-size:13px;color:var(--faint)}

/* lower third */
.lower{display:grid;grid-template-columns:auto 1fr;align-items:stretch;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:52px}
.lower .lab{display:flex;align-items:center;padding:0 16px;font-family:var(--head);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;background:var(--gold);color:#17130A;transition:background .3s,color .3s}
.lower .lab.breaking{background:var(--red);color:#fff}
.lower .hl{display:flex;align-items:center;padding:0 18px;background:#EFEBE3;color:#15161A;font-family:var(--head);font-weight:500;font-size:clamp(17px,1.5vw,23px);line-height:1.15;min-width:0}
.lower .hl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* program nav */
.program{display:flex;align-items:center;gap:10px}
.program .navbtn{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px}
.program .navbtn:hover{border-color:var(--gold)}
.segs{flex:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.seg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.seg.on{border-color:var(--gold)}
.seg .nm{font-family:var(--head);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.seg.on .nm{color:var(--gold2)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:3px;border:0;background:#33353C;cursor:pointer;padding:0}
.dot.seen{background:#6B5A33}
.dot.on{background:var(--gold2);box-shadow:0 0 0 3px rgba(235,199,125,.25)}
.dot.brk{outline:1.5px solid var(--red);outline-offset:1px}

/* ticker */
.ticker{display:grid;grid-template-columns:auto 1fr;border-radius:8px;overflow:hidden;background:#1A1B1F;border:1px solid var(--line);height:36px}
.ticker b{display:flex;align-items:center;padding:0 12px;background:var(--red);font-family:var(--head);font-weight:600;letter-spacing:.12em;font-size:14px}
.ticker .run{overflow:hidden;position:relative}
.ticker .track{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;gap:40px;white-space:nowrap;animation:run 90s linear infinite;font-size:15px;color:#D8D4CC;padding-left:20px}
.ticker .track span::before{content:"◆";color:var(--gold);margin-right:12px;font-size:10px;vertical-align:2px}
@keyframes run{to{transform:translateX(-50%)}}

/* map */
.m-land{fill:#1D1F24;stroke:#2A2C32;stroke-width:.8}
.m-border{fill:none;stroke:#34363D;stroke-width:.7}
.m-kz{fill:none;stroke:var(--gold);stroke-width:1.3;stroke-opacity:.55}
.m-river{fill:none;stroke:#4E6A86;stroke-width:1.4;stroke-linecap:round}
.m-lake{fill:#17212D;stroke:#3F5873;stroke-width:.9}
.m-wl{font-family:var(--body);font-style:italic;font-size:12px;fill:#7F9AB4;paint-order:stroke;stroke:#0C0D0F;stroke-width:3px;stroke-linejoin:round}
.terr{transition:opacity .8s ease}
.tlabel{font-family:var(--head);font-weight:600;font-size:20px;letter-spacing:.04em;fill:#F3EEE4;paint-order:stroke;stroke:#0C0D0F;stroke-width:4px;stroke-linejoin:round;transition:opacity .8s}
.pin{transition:opacity .6s}
.pin .ring{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.8);opacity:0}}
.plabel{font-family:var(--body);font-weight:600;font-size:14px;fill:#F3EEE4;paint-order:stroke;stroke:#0C0D0F;stroke-width:4px;stroke-linejoin:round}
.route{fill:none;stroke-width:3;stroke-linecap:round}
.route.draw{animation:draw 2.2s cubic-bezier(.5,.1,.2,1) forwards}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.rlabel{font-family:var(--body);font-weight:600;font-size:14px;paint-order:stroke;stroke:#0C0D0F;stroke-width:4px;stroke-linejoin:round}

/* intro */
.intro{position:fixed;inset:0;z-index:30;background:radial-gradient(900px 500px at 50% 35%,#1E1F24 0%,#0F1012 70%);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.intro-in{max-width:980px;width:100%;display:flex;flex-direction:column;gap:22px}
.intro .logo{font-size:clamp(44px,7vw,92px)}
.intro .logo b,.intro .logo span{padding:10px 20px}
.intro h1{margin:0;font-family:var(--head);font-weight:500;font-size:clamp(24px,3vw,40px);line-height:1.15;color:var(--text);text-wrap:balance}
.intro h1 em{font-style:normal;color:var(--gold2)}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.slot em{display:block;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--gold2)}
.slot b{display:block;font-family:var(--head);font-weight:500;font-size:19px;margin:2px 0}
.slot span{font-size:13px;color:var(--muted);line-height:1.4;display:block}
.start{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:14px 22px;font-family:var(--head);font-weight:600;font-size:20px;letter-spacing:.08em;cursor:pointer}
.start:hover{filter:brightness(1.1)}
.keys{font-size:13px;color:var(--faint)}

@media (max-width:1100px){
  .stage{grid-template-columns:1fr}
  .monitor{min-height:0;aspect-ratio:1000/700}
  .segs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols{grid-template-columns:1fr}
}
@media (max-width:640px){
  .clock{margin-left:0}
  .rubric-now{display:none}
  .segs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .words{grid-template-columns:1fr}
  .legend{display:none}
  .lower .hl span{white-space:normal}
  .tlabel{font-size:23px}.plabel,.rlabel{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="intro" id="intro">
  <div class="intro-in">
    <div class="logo" aria-label="Сарай TV"><b>САРАЙ</b><span>TV</span></div>
    <h1>Новости Великой степи в эпоху <em>Золотой Орды</em>. Прямой эфир из 1218–1465 годов.</h1>
    <div class="sched" id="sched"></div>
    <button class="start" id="start" type="button">● Начать эфир</button>
    <p class="keys">Управление: → следующий сюжет, ← предыдущий, цифры 1–6 — переход к рубрике.</p>
  </div>
</div>

<div class="app">
  <header class="bar">
    <div class="logo"><b>САРАЙ</b><span>TV</span></div>
    <span class="live"><i></i>ПРЯМОЙ ЭФИР</span>
    <span class="rubric-now">Рубрика: <b id="rubNow"></b></span>
    <div class="clock" aria-live="polite"><small>ГОД ЭФИРА</small><strong id="year">1218</strong></div>
  </header>

  <section class="stage">
    <div class="monitor">
      <svg id="svg" viewBox="0 0 1000 700" role="img" aria-label="Карта Великой степи с местом события">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
          <clipPath id="landclip"><path id="landclipPath"/></clipPath>
        </defs>
        <rect width="1000" height="700" fill="#0C0D0F"/>
        <path id="land" class="m-land"/>
        <g id="terrs" clip-path="url(#landclip)"></g>
        <path id="borders" class="m-border"/>
        <path id="kz" class="m-kz"/>
        <g id="lakes"></g><g id="rivers"></g><g id="wlabels"></g>
        <g id="tlabels"></g><g id="routes"></g><g id="pins"></g>
      </svg>
      <div class="onair"><small id="onairSmall">ПРЯМОЕ ВКЛЮЧЕНИЕ</small><strong id="onair"></strong></div>
      <div class="legend"><span><i style="border-top:2px solid #D6A64A;opacity:.7"></i>Казахстан сегодня</span><span><i style="border-top:2px solid #4E6A86"></i>реки</span><span><i style="border-top:2px dashed #EFEBE3"></i>маршруты и походы</span></div>
      <div class="flash" id="flash"><div>СРОЧНО</div></div>
    </div>

    <article class="desk" id="desk" aria-live="polite">
      <div class="desk-top"><span class="tag" id="tag"></span><span class="count" id="count"></span></div>
      <div class="swap" id="body"></div>
    </article>
  </section>

  <div class="lower"><div class="lab" id="lowLab"></div><div class="hl"><span id="lowHl"></span></div></div>

  <nav class="program" aria-label="Программа эфира">
    <button class="navbtn" id="prev" type="button" aria-label="Предыдущий сюжет">←</button>
    <div class="segs" id="segs"></div>
    <button class="navbtn" id="next" type="button" aria-label="Следующий сюжет">→</button>
  </nav>

  <div class="ticker" aria-hidden="true"><b>ФАКТЫ</b><div class="run"><div class="track" id="track"></div></div></div>
</div>

function extra(ex) {

let cur = -1, yearNow = 1218, yearRaf = 0;
function animateYear(to, label) {
  cancelAnimationFrame(yearRaf);
  const from = yearNow, t0 = performance.now(), dur = 900;
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    $("year").textContent = Math.round(from + (to - from) * e);
    if (k < 1) yearRaf = requestAnimationFrame(step); else { $("year").textContent = label; yearNow = to; }
  };
  yearRaf = requestAnimationFrame(step);
}
function setMap(m) {
  Object.entries(terrEls).forEach(([k, g]) => { const on = m.terr.includes(k); g.setAttribute("opacity", on ? 1 : 0); tlabEls[k].setAttribute("opacity", on ? 1 : 0); });
  Object.entries(pinEls).forEach(([k, g]) => g.setAttribute("opacity", m.pins.includes(k) ? 1 : 0));
  const act = Object.fromEntries(m.routes);
  Object.entries(routeEls).forEach(([k, r]) => {
    if (act[k]) {
      r.g.setAttribute("opacity", 1); r.p.setAttribute("stroke", act[k]); r.p.setAttribute("stroke-dasharray", "");
      r.labels.forEach((t) => t.setAttribute("fill", act[k]));
      const len = r.p.getTotalLength(); r.p.style.setProperty("--len", len);
      r.p.style.strokeDasharray = len; r.p.style.strokeDashoffset = len;
      r.p.classList.remove("draw"); void r.p.getBBox(); r.p.classList.add("draw");
    } else r.g.setAttribute("opacity", 0);
  });
}

  $("tag").textContent = s.brk ? "Срочно" : rb.nm; $("tag").classList.toggle("breaking", !!s.brk);
  $("count").textContent = `Сюжет ${i + 1} из ${S.length}`;
  $("lowLab").textContent = s.brk ? "Срочно" : rb.nm; $("lowLab").classList.toggle("breaking", !!s.brk);
  $("lowHl").textContent = s.hl;
  $("onairSmall").textContent = s.r === 5 ? "СТУДИЯ" : "ПРЯМОЕ ВКЛЮЧЕНИЕ";
  $("onair").textContent = s.place;
  const b = $("body"); b.classList.add("out");
  setTimeout(() => { b.innerHTML = bodyHTML(s); b.classList.remove("out"); $("desk").scrollTop = 0; }, 220);
  setMap(s.map);
  animateYear(s.y, s.yl);
  if (s.brk) { const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
  segEls.forEach((x, k) => x.seg.classList.toggle("on", k === s.r));
  dotEls.forEach((d, k) => { d.classList.toggle("on", k === i); if (k === i) d.classList.add("seen"); });
}
$("prev").addEventListener("click", () => go(cur - 1));
$("next").addEventListener("click", () => go(cur + 1));
document.addEventListener("keydown", (e) => {
  if (!$("intro").hidden) { if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") { e.preventDefault(); startShow(); } return; }
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
  else if (/^[1-6]$/.test(e.key)) go(S.findIndex((s) => s.r === +e.key - 1));
});
function startShow() { $("intro").hidden = true; }
$("start").addEventListener("click", startShow);
go(0);
</script>
